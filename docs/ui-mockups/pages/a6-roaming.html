<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A6 漫游大场景页 — 页面排版稿</title>
<link rel="stylesheet" href="../style.css">
<script>
  (function () {
    try {
      var m = location.search.match(/theme=(light|dark)/);
      var t = m ? m[1] : localStorage.getItem('wsu3.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* file:// 下取不到也没关系 */ }
    // 输入模态：鼠标不画焦点环，键盘导航才画（参考 dsh 的 focus.css:18-21）。
    var set = function (m) { document.documentElement.setAttribute('data-input-modality', m); };
    set('pointer');
    addEventListener('pointerdown', function () { set('pointer'); }, true);
    addEventListener('keydown', function (e) {
      if (e.key === 'Tab' || e.key.indexOf('Arrow') === 0) set('keyboard');
    }, true);
  })();
</script>
</head>
<body>
<div class="board-wrap"><div class="board">
  <div class="board__bg"></div>

      <header class="ui-titlebar">
        <div class="ui-titlebar__logo">仿</div>
        <div class="ui-titlebar__names">
          <div class="ui-titlebar__cn">虚拟仿真教学平台</div>
          <div class="ui-titlebar__en">Virtual Simulation Teaching Platform</div>
        </div>
        <div class="ui-titlebar__right">
          <span class="ui-titlebar__crumb">漫游 / 实验楼一层</span>
          <span class="ui-badge ui-badge--info">高清</span><span class="ui-badge">游客</span>
        </div>
      </header>
  <div class="board__body">

      <div style="position:absolute;inset:0">
        <div class="ui-viewport" style="position:absolute;inset:0">
          <div class="ui-viewport__hint">Unity WebGL · 漫游场景</div>
          <div class="ui-viewport__center">三维画布区域（Unity 侧 UI 暂不设计）</div>
        </div>
        <div class="ui-topright">
          <button class="ui-iconbtn ui-iconbtn--back">← 返回目录</button>
          <button class="ui-iconbtn ui-iconbtn--icon" title="全屏">⛶</button>
          <button class="ui-iconbtn ui-iconbtn--icon" title="画质">◐</button>
          <button class="ui-iconbtn ui-iconbtn--icon" title="帮助">?</button>
          <button class="ui-iconbtn">◎ 复位</button>
        </div>
        <div style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center">
          <div class="ui-toast" style="position:static;transform:none">W / A / S / D 移动 · 右键拖拽转视角 · 对准设备点击进入该项目</div>
        </div>
        <div class="ui-panel" style="position:absolute;right:18px;bottom:96px;width:380px">
          <div class="ui-panel__head">设备信息<span class="ui-panel__right"><span class="ui-badge ui-badge--info">可进入</span></span></div>
          <div class="ui-panel__body ui-col">
            <div style="font-size:var(--fs-16);font-weight:600">实验台 03 · 温度传感器</div>
            <div class="ui-muted ui-small">对应教学项目：温度传感器特性测量</div>
            <button class="ui-btn ui-btn--primary ui-btn--block">进入该项目</button>
          </div>
        </div>
      </div>
      <div class="note">A6 · <b>漫游大场景</b> · 仅确认"返回/复位在右上 + 提示为浮窗"这套新规范，三维侧 UI 暂不细化</div>

  </div>

</div></div>

<div class="board-nav">
  <a href="../index.html">← 样式清单 / 页面索引</a>
  <span>A6 · 漫游大场景页 · 归属 Roaming</span>
  <span class="theme-switch"><a href="?theme=dark">深色</a><a href="?theme=light">亮色</a></span>
</div>
</body>
</html>
