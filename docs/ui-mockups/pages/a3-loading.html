<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A3 加载过渡页 — 页面排版稿</title>
<link rel="stylesheet" href="../style.css">
<script>
  (function () {
    try {
      var m = location.search.match(/theme=(light|dark)/);
      var t = m ? m[1] : localStorage.getItem('wsu3.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* file:// 下取不到也没关系 */ }
    // 输入模态：鼠标不画焦点环，键盘导航才画（规则见 docs/design/07-frame-style-rules.md §5）。
    var set = function (m) { document.documentElement.setAttribute('data-input-modality', m); };
    set('pointer');
    addEventListener('pointerdown', function () { set('pointer'); }, true);
    addEventListener('keydown', function (e) {
      if (e.key === 'Tab' || e.key.indexOf('Arrow') === 0) set('keyboard');
    }, true);
  })();
</script>
</head>
<body>
<div class="board-wrap"><div class="board">
  <div class="board__bg"></div>

      <header class="ui-titlebar ui-titlebar--float">
        <div class="ui-titlebar__logo">仿</div>
        <div class="ui-titlebar__names">
          <div class="ui-titlebar__cn">虚拟仿真教学平台</div>
          <div class="ui-titlebar__en">Virtual Simulation Teaching Platform</div>
        </div>
        <div class="ui-titlebar__right">
          <span class="ui-titlebar__crumb">加载中</span>
          
        </div>
      </header>
  <div class="board__body">

      <!-- 加载环单独居中；文字与进度整体压到下部（2026-10-12 审核意见） -->
      <div class="ui-center" style="height:100%">
        <div class="ui-loading-ring"></div>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:56px;display:flex;flex-direction:column;align-items:center;gap:14px">
        <div class="ui-h2">正在加载实验环境…</div>
        <div style="width:620px">
          <div class="ui-progress ui-progress--lg"><div class="ui-progress__bar" style="width:64%"></div></div>
          <div class="ui-row" style="justify-content:space-between;margin-top:10px">
            <span class="ui-muted ui-small">当前阶段：加载三维资源（Addressables 分包）</span>
            <span class="ui-small" style="color:var(--accent-2)">64%</span>
          </div>
        </div>
        <div class="ui-muted ui-small">首次加载较慢；后续进入同一实验会命中缓存</div>
      </div>
      <div class="note">A3 · <b>加载过渡页</b> · 环形进度居中 + 阶段文案与条形进度在下部</div>

  </div>

      <footer class="ui-statusbar">
        <span>[ 加载中 ] 正在准备实验环境</span>
        <span class="ui-statusbar__right">请勿关闭页面</span>
      </footer>
</div></div>

<div class="board-nav">
  <a href="../index.html">← 样式清单 / 页面索引</a>
  <span>A3 · 加载过渡页 · 归属 常驻（切场景时）</span>
  <span class="theme-switch"><a href="?theme=dark">深色</a><a href="?theme=light">亮色</a></span>
</div>
</body>
</html>
