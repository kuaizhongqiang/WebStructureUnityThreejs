<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3 D3 答题对错反馈 — 页面排版稿</title>
<link rel="stylesheet" href="../style.css">
<script>
  (function () {
    try {
      var m = location.search.match(/theme=(light|dark)/);
      var t = m ? m[1] : localStorage.getItem('wsu3.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* file:// 下取不到也没关系 */ }
    // 输入模态：鼠标不画焦点环，键盘导航才画（规则见 docs/design/07-frame-style-rules.md §5）。
    var set = function (m) { document.documentElement.setAttribute('data-input-modality', m); };
    set('pointer');
    addEventListener('pointerdown', function () { set('pointer'); }, true);
    addEventListener('keydown', function (e) {
      if (e.key === 'Tab' || e.key.indexOf('Arrow') === 0) set('keyboard');
    }, true);
  })();
</script>
</head>
<body>
<div class="board-wrap"><div class="board">
  <div class="board__bg"></div>

      <header class="ui-titlebar ui-titlebar--float">
        <div class="ui-titlebar__logo">仿</div>
        <div class="ui-titlebar__names">
          <div class="ui-titlebar__cn">虚拟仿真教学平台</div>
          <div class="ui-titlebar__en">Virtual Simulation Teaching Platform</div>
        </div>
        <div class="ui-titlebar__right">
          <span class="ui-titlebar__crumb">组件规范</span>
          
        </div>
      </header>
  <div class="board__body">

      <div style="padding:28px 32px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div class="ui-card ui-center" style="gap:14px;padding:34px;border-color:var(--ok)">
          <div style="width:72px;height:72px;border-radius:50%;background:var(--ok-weak);border:2px solid var(--ok);display:flex;align-items:center;justify-content:center;font-size:34px;color:#8ce6ab"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></div>
          <div class="ui-h2">回答正确</div>
          <div class="ui-badge ui-badge--gold">+ 5 分</div>
          <div class="ui-muted ui-small" style="max-width:320px">解析：直流电压档用于测量电压，表笔需并联在被测两端。</div>
          <button class="ui-btn ui-btn--primary">下一题</button>
        </div>
        <div class="ui-card ui-center" style="gap:14px;padding:34px;border-color:var(--err)">
          <div style="width:72px;height:72px;border-radius:50%;background:var(--err-weak);border:2px solid var(--err);display:flex;align-items:center;justify-content:center;font-size:34px;color:#ffb0b0"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></div>
          <div class="ui-h2">回答错误</div>
          <div class="ui-badge ui-badge--err">正确答案：B</div>
          <div class="ui-muted ui-small" style="max-width:320px">你选择了 C（电阻档）。测量电压时使用电阻档会造成读数无意义。</div>
          <div class="ui-row"><button class="ui-btn">查看解析</button><button class="ui-btn ui-btn--primary">下一题</button></div>
        </div>
        <div class="ui-alert ui-alert--info" style="grid-column:1 / -1">
          <span class="ui-alert__icon"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg></span>
          <span>规范：对错图标 72px 圆形；正确用 ok 绿、错误用 err 红；必须给出<b>解析</b>；得分变化用金色徽章展示。</span>
        </div>
      </div>

  </div>

      <footer class="ui-statusbar">
        <span>[ 就绪 ] 无后端模式（DEC-21）</span>
        <span class="ui-statusbar__right">v0.2 · 排版稿 · docs/ui-mockups</span>
      </footer>
</div></div>

<div class="board-nav">
  <a href="../index.html">← 样式清单 / 页面索引</a>
  <span>D3 · D3 答题对错反馈 · 归属 UI · 组件规范</span>
  <span class="theme-switch"><a href="?theme=dark">深色</a><a href="?theme=light">亮色</a></span>
</div>
</body>
</html>
